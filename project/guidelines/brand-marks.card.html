<!-- @dsCard group="Brand" viewport="700x150" subtitle="Logo lockup, radii, eyebrow motif" name="Brand Marks" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--semers-panel-dark);padding:20px 24px;display:flex;align-items:center;gap:30px}
.logo{display:flex;align-items:center;gap:11px}
.mark{width:34px;height:34px;border-radius:9px;background:var(--semers-apple);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:600;font-size:16px;color:#1B1A16}
.wm{line-height:1.1}.wm .t{font-weight:600;font-size:15px;color:var(--semers-on-dark);letter-spacing:.2px}
.wm .s{font-family:var(--font-mono);font-size:10px;color:var(--semers-on-dark-mut);letter-spacing:.5px}
.radii{display:flex;gap:10px}.rb{width:46px;height:46px;background:#3a382f;border:1px solid #4a473d}
.cap{font-family:var(--font-mono);font-size:9px;color:var(--semers-on-dark-mut);text-align:center;margin-top:5px}</style></head>
<body>
<div class="logo"><div class="mark">S</div><div class="wm"><div class="t">SEMERS OS</div><div class="s">v1.0 · OPERATIONS</div></div></div>
<div>
<div class="radii">
<div><div class="rb" style="border-radius:6px"></div><div class="cap">6 xs</div></div>
<div><div class="rb" style="border-radius:9px"></div><div class="cap">9 btn</div></div>
<div><div class="rb" style="border-radius:12px"></div><div class="cap">12 card</div></div>
<div><div class="rb" style="border-radius:14px"></div><div class="cap">14 panel</div></div>
<div><div class="rb" style="border-radius:20px"></div><div class="cap">20 pill</div></div>
</div></div>
</body></html>
