<!-- @dsCard group="Colors" viewport="700x150" subtitle="Surfaces & ink on warm cream base" name="Base & Surfaces" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--surface-app);padding:16px;display:flex;gap:12px;flex-wrap:wrap}
.sw{display:flex;flex-direction:column;gap:6px}.chip{width:96px;height:52px;border-radius:10px;border:1px solid rgba(0,0,0,.06)}
.n{font-size:12px;font-weight:600;color:var(--text-primary)}.h{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}</style></head>
<body>
<div class="sw"><div class="chip" style="background:var(--semers-bg)"></div><div class="n">App BG</div><div class="h">#F1EEE7</div></div>
<div class="sw"><div class="chip" style="background:var(--semers-surface)"></div><div class="n">Surface</div><div class="h">#FFFFFF</div></div>
<div class="sw"><div class="chip" style="background:var(--semers-surface-cream)"></div><div class="n">Cream</div><div class="h">#F4F1E9</div></div>
<div class="sw"><div class="chip" style="background:var(--semers-beige)"></div><div class="n">Beige</div><div class="h">#EFE9DC</div></div>
<div class="sw"><div class="chip" style="background:var(--semers-panel-dark)"></div><div class="n">Sidebar</div><div class="h">#23211C</div></div>
<div class="sw"><div class="chip" style="background:var(--semers-ink)"></div><div class="n">Ink</div><div class="h">#2A2722</div></div>
</body></html>
