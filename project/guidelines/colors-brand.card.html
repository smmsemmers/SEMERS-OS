<!-- @dsCard group="Colors" viewport="700x150" subtitle="Apple-green brand + pastel accents" name="Brand / Primary" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--surface-app);padding:16px;display:flex;gap:12px;flex-wrap:wrap}
.sw{display:flex;flex-direction:column;gap:6px}.chip{width:110px;height:52px;border-radius:10px;border:1px solid rgba(0,0,0,.06)}
.n{font-size:12px;font-weight:600;color:var(--text-primary)}.h{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}</style></head>
<body>
<div class="sw"><div class="chip" style="background:var(--semers-green)"></div><div class="n">Green · primary</div><div class="h">#5C8A3F</div></div>
<div class="sw"><div class="chip" style="background:var(--semers-apple)"></div><div class="n">Apple</div><div class="h">#7FA45C</div></div>
<div class="sw"><div class="chip" style="background:var(--semers-apple-pastel)"></div><div class="n">Pastel</div><div class="h">#A6C97F</div></div>
<div class="sw"><div class="chip" style="background:var(--semers-green-soft)"></div><div class="n">Green soft</div><div class="h">#EAF1E1</div></div>
</body></html>
