<!-- @dsCard group="Spacing" viewport="700x150" subtitle="4px-based rhythm — gaps, padding, control heights" name="Spacing Scale" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--surface-card);padding:18px 22px}
.row{display:flex;align-items:flex-end;gap:18px}.b{display:flex;flex-direction:column;align-items:center;gap:6px}
.bar{background:var(--semers-apple-pastel);border-radius:4px;width:30px}
.n{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}.l{font-size:11px;color:var(--text-secondary)}</style></head>
<body><div class="row">
<div class="b"><div class="bar" style="height:12px"></div><div class="n">12</div><div class="l">KPI gap</div></div>
<div class="b"><div class="bar" style="height:18px"></div><div class="n">18</div><div class="l">column</div></div>
<div class="b"><div class="bar" style="height:20px"></div><div class="n">20</div><div class="l">card pad</div></div>
<div class="b"><div class="bar" style="height:26px"></div><div class="n">26</div><div class="l">screen pad</div></div>
<div class="b"><div class="bar" style="height:38px;width:60px;background:var(--semers-line)"></div><div class="n">38</div><div class="l">control h</div></div>
<div class="b"><div class="bar" style="height:40px;width:60px;background:var(--semers-green)"></div><div class="n">40</div><div class="l">button h</div></div>
</div></body></html>
